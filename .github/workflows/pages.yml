name: build-and-publish

# Every push to main: test the registry, build the site, publish to GitHub Pages.
# Nothing reaches the site unless the tests pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test registry and tokens
        run: python -m pytest -q tests
      - name: Build site
        run: python scripts/build.py
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Render profile PDFs
        run: python scripts/pdfs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
